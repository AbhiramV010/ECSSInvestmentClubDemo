<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy Low, Sell High</title>
<link rel="icon" type="image/png" href="img.png">
<style>
  @font-face {
    font-family: "Roboto Slab";
    src: url("fonts/roboto-slab-latin-wght.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --desktop: #008080;
    --face: #c0c0c0;
    --navy: #000080;
    --sky: #1084d0;
    --green: #0a7a0a;
    --red: #c00000;
    --screen: #000;
    --led-up: #3dff3d;
    --led-down: #ff4d4d;
    /* Win98 bevels */
    --raised: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    --pressed: inset -1px -1px #fff, inset 1px 1px #000, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
    --sunken: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--desktop);
    color: #000;
    font-family: "Roboto Slab", Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
  }

  /* Main blue title bar */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    background: linear-gradient(90deg, var(--navy), var(--sky));
    color: #fff;
    padding: 6px 12px;
    border-bottom: 2px solid #000;
  }
  header img { height: 76px; width: auto; display: block; background: #fff; padding: 3px 8px; box-shadow: var(--sunken); justify-self: start; }
  header h1.brand {
    margin: 0;
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: .03em;
    text-align: center;
    text-shadow: 2px 2px 0 #000;
  }
  .ctl { display: flex; gap: 2px; justify-self: end; }
  .ctl span {
    width: 26px; height: 24px;
    display: grid; place-items: center;
    background: var(--face); color: #000;
    box-shadow: var(--raised);
    font-size: 14px; font-weight: 800; line-height: 1;
  }

  .layout { flex: 1; display: flex; gap: 24px; padding: 16px 24px; align-items: flex-start; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; align-self: stretch; }

  /* Windows */
  .win { background: var(--face); box-shadow: var(--raised), 4px 4px 0 rgba(0,0,0,.45); padding: 3px; }
  main .win { width: min(680px, 100%); }
  aside.win { width: 300px; display: none; }
  aside.win.open { display: block; }
  .titlebar {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(90deg, var(--navy), var(--sky));
    color: #fff;
    padding: 3px 4px 3px 8px;
    font-weight: 700;
    font-size: .95rem;
  }
  .titlebar .ctl span { width: 20px; height: 18px; font-size: 11px; }
  .win-body { padding: 12px 16px; }
  .screen { display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }
  #gameScreen { position: relative; }

  /* Pre-round countdown covers the game screen until the round starts */
  #countdown {
    display: none;
    position: absolute; inset: 0; z-index: 1;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--screen); box-shadow: var(--sunken); color: var(--led-up);
  }
  #countdown.active { display: flex; }
  #countdown small { color: #9a9a9a; font-size: 1rem; letter-spacing: .2em; }
  #countdownNum { font-size: 9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }

  h1 { margin: 0 0 8px; font-size: 2.4rem; text-align: center; }
  p.rules { font-size: 1.1rem; margin: 0 0 24px; text-align: center; max-width: 520px; }
  label { font-weight: 700; margin-bottom: 6px; }
  #playedMsg { color: var(--red); font-weight: 700; min-height: 1.4em; margin: 8px 0 0; }

  input[type=text] {
    width: 100%;
    max-width: 320px;
    font: inherit;
    font-size: 1.3rem;
    padding: 8px 10px;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: #000;
    box-shadow: var(--sunken);
    text-align: center;
    margin-bottom: 20px;
  }
  input[type=text]:focus { outline: 1px dotted #000; outline-offset: -6px; }

  button {
    font: inherit;
    font-weight: 700;
    letter-spacing: .04em;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    background: var(--face);
    color: #000;
    box-shadow: var(--raised);
  }
  button:active:not(:disabled) { box-shadow: var(--pressed); padding-top: calc(var(--py, 10px) + 1px); padding-left: calc(var(--px, 24px) + 1px); }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -6px; }
  button:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; cursor: not-allowed; }
  .big { --py: 12px; --px: 40px; font-size: 1.4rem; padding: var(--py) var(--px); }
  #buyBtn, #sellBtn { --py: 16px; --px: 0px; flex: 1; font-size: 1.8rem; padding: var(--py) 0; color: #fff; text-shadow: 1px 1px 0 #000; }
  #buyBtn { background: var(--green); }
  #sellBtn { background: var(--red); }
  #buyBtn:disabled, #sellBtn:disabled { background: var(--face); color: #808080; text-shadow: 1px 1px 0 #fff; }

  /* Black LED screens */
  .led { background: var(--screen); box-shadow: var(--sunken); color: var(--led-up); text-align: center; }
  .led .pos, .led .up { color: var(--led-up); }
  .led .neg, .led .down { color: var(--led-down); }

  .led.field { background: var(--screen); color: var(--led-up); }
  .hud { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; width: 100%; margin-bottom: 12px; }
  .field { background: #fff; box-shadow: var(--sunken); padding: 6px 12px; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; }
  #timerBox { padding: 4px 16px; min-width: 96px; justify-content: center; }
  #timer { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--led-down); }
  #priceBox { width: 100%; padding: 6px 12px; margin-bottom: 12px; }
  #priceBox small { display: block; color: #9a9a9a; font-size: .75rem; letter-spacing: .2em; }
  #price { font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  canvas { width: 100%; height: 190px; background: var(--screen); box-shadow: var(--sunken); margin-bottom: 12px; display: block; }
  .trade-row { display: flex; gap: 16px; width: 100%; margin-bottom: 10px; }
  .locks { display: flex; gap: 8px; width: 100%; }
  .locks span { flex: 1; box-shadow: var(--sunken); padding: 4px 10px; font-size: 1rem; min-height: 1.9em; }

  #resultName { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; overflow-wrap: anywhere; text-align: center; }
  #resultBox { width: 100%; padding: 12px; margin-bottom: 12px; }
  #resultProfit { font-size: 4.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #resultMsg { font-size: 1.4rem; margin: 4px 0 24px; text-align: center; }

  #boardWrap { background: #fff; box-shadow: var(--sunken); padding: 8px 12px; }
  ol { margin: 0; padding: 0; list-style: none; }
  li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px dotted #808080;
    font-size: 1.05rem;
  }
  li:last-child { border-bottom: 0; }
  li .rank { color: var(--navy); font-weight: 800; width: 1.5em; }
  li .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .val { font-variant-numeric: tabular-nums; font-weight: 700; }
  li.empty { color: #808080; justify-content: center; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  @media (max-width: 800px) {
    header { grid-template-columns: auto 1fr; }
    header .ctl { display: none; }
    header h1.brand { font-size: 1.5rem; }
    header img { height: 56px; }
    .layout { flex-direction: column-reverse; padding: 12px; align-items: stretch; }
    aside.win { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <img src="img.png" alt="St. Edmund Campion Investment Club logo">
  <h1 class="brand">ECSS Investment Club</h1>
  <div class="ctl" aria-hidden="true"><span>_</span><span>&#9633;</span><span>&#10005;</span></div>
</header>
<div class="layout">
<main>
  <div class="win">
    <div class="titlebar"><span>Trading Terminal</span><div class="ctl" aria-hidden="true"><span>_</span><span>&#9633;</span><span>&#10005;</span></div></div>
    <div class="win-body">
      <!-- Start screen -->
      <section id="startScreen" class="screen active">
        <h1>Buy Low, Sell High</h1>
        <p class="rules">You have 30 seconds. Press BUY once, then SELL once. Make the biggest profit.</p>
        <label for="nameInput">Student number:</label>
        <input id="nameInput" name="student-number" type="text" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" placeholder="9-digit student number" autocomplete="off" spellcheck="false" autofocus>
        <div id="playedMsg" role="alert"></div>
        <button id="startBtn" class="big" disabled>START</button>
      </section>

      <!-- Game screen -->
      <section id="gameScreen" class="screen">
        <div id="countdown" aria-live="assertive"><small>GET READY</small><div id="countdownNum">5</div></div>
        <div class="hud">
          <div class="field" id="playerName"></div>
          <div class="led field" id="timerBox"><div id="timer">30</div></div>
        </div>
        <div class="led" id="priceBox"><small>PRICE</small><div id="price">100.00</div></div>
        <canvas id="chart" width="640" height="190"></canvas>
        <div class="trade-row">
          <button id="buyBtn">BUY</button>
          <button id="sellBtn" disabled>SELL</button>
        </div>
        <div class="locks">
          <span>Bought at: <b id="buyLock">—</b></span>
          <span>Sold at: <b id="sellLock">—</b></span>
        </div>
      </section>

      <!-- End screen -->
      <section id="endScreen" class="screen">
        <div id="resultName"></div>
        <div class="led" id="resultBox"><div id="resultProfit"></div></div>
        <div id="resultMsg"></div>
        <button id="nextBtn" class="big">NEXT PLAYER</button>
      </section>
    </div>
  </div>
</main>

<aside id="boardPanel" class="win">
  <div class="titlebar"><span>Top Traders</span><div class="ctl" aria-hidden="true"><span>_</span><span>&#9633;</span><span>&#10005;</span></div></div>
  <div class="win-body">
    <div id="boardWrap"><ol id="board"></ol></div>
  </div>
</aside>
</div>

<script>
(() => {
  const ROUND_MS = 30000;
  const COUNTDOWN_MS = 5000;
  const TICK_MS = 200;
  const START_PRICE = 750;
  const MIN_PRICE = 500, MAX_PRICE = 1000;
  const STORAGE_KEY = "ecss-leaderboard";
  const PLAYED_KEY = "ecss-played-ids";

  const $ = id => document.getElementById(id);
  const screens = { start: $("startScreen"), game: $("gameScreen"), end: $("endScreen") };
  const nameInput = $("nameInput"), startBtn = $("startBtn");
  const buyBtn = $("buyBtn"), sellBtn = $("sellBtn");
  const priceEl = $("price"), timerEl = $("timer");
  const canvas = $("chart"), ctx = canvas.getContext("2d");

  let leaderboard = load();   // [{name, profit}], sorted desc, max 5
  let played = loadPlayed();  // every student number that has started a round (not capped like the board)
  let game = null;            // active round state
  let intervalId = null;

  function loadPlayed() {
    try {
      const data = JSON.parse(localStorage.getItem(PLAYED_KEY));
      if (Array.isArray(data)) return new Set(data.filter(s => typeof s === "string"));
    } catch (e) {}
    return new Set();
  }
  function savePlayed() {
    try { localStorage.setItem(PLAYED_KEY, JSON.stringify([...played])); } catch (e) {}
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(data)) return data.filter(e => typeof e.name === "string" && Number.isFinite(e.profit));
    } catch (e) {}
    return [];
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leaderboard)); } catch (e) {}
  }

  const isValidId = s => /^\d{9}$/.test(s);
  const fmt = n => n.toFixed(2);
  const fmtProfit = n => (n > 0 ? "+" : n < 0 ? "−" : "") + "$" + fmt(Math.abs(n));

  function show(name) {
    for (const [k, el] of Object.entries(screens)) el.classList.toggle("active", k === name);
  }

  function renderBoard() {
    const ol = $("board");
    ol.textContent = "";
    if (!leaderboard.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No scores yet";
      ol.appendChild(li);
      return;
    }
    leaderboard.forEach((e, i) => {
      const li = document.createElement("li");
      const rank = document.createElement("span"); rank.className = "rank"; rank.textContent = i + 1;
      const who = document.createElement("span"); who.className = "who"; who.textContent = e.name;
      const val = document.createElement("span");
      val.className = "val " + (e.profit > 0 ? "pos" : e.profit < 0 ? "neg" : "");
      val.textContent = fmtProfit(e.profit);
      li.append(rank, who, val);
      ol.appendChild(li);
    });
  }

  function addScore(name, profit) {
    leaderboard.push({ name, profit });
    // Array.prototype.sort is stable, so earlier players win ties
    leaderboard.sort((a, b) => b.profit - a.profit);
    leaderboard = leaderboard.slice(0, 5);
    save();
    renderBoard();
  }

  function nextPrice(p) {
    // random walk with slight mean reversion so it stays in a playable range
    const drift = (START_PRICE - p) * 0.004;
    // slight upward bias (0.48 vs 0.5) so winning trades are a bit more likely
    const shock = (Math.random() - 0.48) * 30;
    return Math.min(MAX_PRICE, Math.max(MIN_PRICE, p + drift + shock));
  }

  function drawChart() {
    const w = canvas.width, h = canvas.height, pts = game.history;
    ctx.clearRect(0, 0, w, h);
    const min = Math.min(...pts), max = Math.max(...pts);
    const pad = 16, span = Math.max(max - min, 1);
    const x = i => pad + (i / (ROUND_MS / TICK_MS)) * (w - 2 * pad);
    const y = v => h - pad - ((v - min) / span) * (h - 2 * pad);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.09)";
    ctx.beginPath();
    for (let i = 1; i < 4; i++) { ctx.moveTo(0, (h * i) / 4); ctx.lineTo(w, (h * i) / 4); }
    for (let i = 1; i < 6; i++) { ctx.moveTo((w * i) / 6, 0); ctx.lineTo((w * i) / 6, h); }
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#ffe94d";
    ctx.beginPath();
    pts.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
    ctx.stroke();

    const mark = (price, color) => {
      const idx = pts.indexOf(price);
      if (idx < 0) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x(idx), y(price), 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    };
    if (game.buyPrice !== null) mark(game.buyPrice, "#3dff3d");
    if (game.sellPrice !== null) mark(game.sellPrice, "#ff4d4d");
  }

  function startGame() {
    if (game) return;  // already counting down or playing (e.g. Enter pressed again)
    const name = nameInput.value.trim();
    if (!isValidId(name)) return;
    if (played.has(name)) {
      $("playedMsg").textContent = "You've already played!";
      return;
    }
    // Recorded at start so reloading mid-round can't buy a second attempt
    played.add(name);
    savePlayed();
    game = {
      name,
      price: START_PRICE,
      history: [START_PRICE],
      buyPrice: null,
      sellPrice: null,
      endsAt: 0,  // set when the countdown finishes
    };
    $("playerName").textContent = name;
    $("buyLock").textContent = "—";
    $("sellLock").textContent = "—";
    buyBtn.disabled = true;
    sellBtn.disabled = true;
    priceEl.className = "";
    show("game");
    render();
    runCountdown(beginRound);
  }

  function runCountdown(done) {
    const overlay = $("countdown"), numEl = $("countdownNum");
    const goAt = Date.now() + COUNTDOWN_MS;
    overlay.classList.add("active");
    const update = () => {
      const remaining = goAt - Date.now();
      if (remaining <= 0) {
        clearInterval(intervalId);
        overlay.classList.remove("active");
        return done();
      }
      numEl.textContent = Math.ceil(remaining / 1000);
    };
    update();
    intervalId = setInterval(update, 100);
  }

  function beginRound() {
    game.endsAt = Date.now() + ROUND_MS;
    buyBtn.disabled = false;
    intervalId = setInterval(tick, TICK_MS);
  }

  function tick() {
    const remaining = game.endsAt - Date.now();
    if (remaining <= 0) return endGame();
    const prev = game.price;
    game.price = nextPrice(prev);
    game.history.push(game.price);
    priceEl.className = game.price >= prev ? "up" : "down";
    render(remaining);
  }

  function render(remaining = ROUND_MS) {
    const secs = Math.ceil(remaining / 1000);
    timerEl.textContent = secs;
    timerEl.classList.toggle("low", secs <= 5);
    priceEl.textContent = "$" + fmt(game.price);
    drawChart();
  }

  function buy() {
    if (!game || game.buyPrice !== null) return;
    game.buyPrice = game.price;
    $("buyLock").textContent = "$" + fmt(game.buyPrice);
    buyBtn.disabled = true;
    sellBtn.disabled = false;
  }

  function sell() {
    if (!game || game.buyPrice === null || game.sellPrice !== null) return;
    game.sellPrice = game.price;
    endGame();
  }

  function endGame() {
    clearInterval(intervalId);
    intervalId = null;
    // Auto-sell at the final price if the player bought but never sold
    if (game.buyPrice !== null && game.sellPrice === null) game.sellPrice = game.price;
    $("sellLock").textContent = game.sellPrice !== null ? "$" + fmt(game.sellPrice) : "—";
    buyBtn.disabled = sellBtn.disabled = true;
    drawChart();

    const traded = game.buyPrice !== null;
    // Round to cents so displayed values, sorting and messages agree
    const profit = traded ? Math.round((game.sellPrice - game.buyPrice) * 100) / 100 : 0;

    let msg;
    if (!traded) msg = "No trade. Playing it safe!";
    else if (profit > 0) msg = "Nice trade!";
    else if (profit < 0) msg = "Ouch, you bought the top";
    else msg = "Break even";

    $("resultName").textContent = game.name;
    const pe = $("resultProfit");
    pe.textContent = fmtProfit(profit);
    pe.className = profit > 0 ? "pos" : profit < 0 ? "neg" : "";
    $("resultMsg").textContent = msg;

    addScore(game.name, profit);
    game = null;
    // Brief pause so the player sees the locked sell price before the result appears
    setTimeout(() => { if (!game) show("end"); $("nextBtn").focus(); }, 600);
  }

  function nextPlayer() {
    nameInput.value = "";
    $("playedMsg").textContent = "";
    startBtn.disabled = true;
    show("start");
    nameInput.focus();
  }

  nameInput.addEventListener("input", () => {
    nameInput.value = nameInput.value.replace(/\D/g, "").slice(0, 9);
    startBtn.disabled = !isValidId(nameInput.value);
    $("playedMsg").textContent = "";
  });
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
  startBtn.addEventListener("click", startGame);
  buyBtn.addEventListener("click", buy);
  sellBtn.addEventListener("click", sell);
  $("nextBtn").addEventListener("click", nextPlayer);

  // Ctrl+Shift+F12 (with Fn on laptops) toggles the leaderboard panel
  document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && e.key === "F12") {
      e.preventDefault();
      $("boardPanel").classList.toggle("open");
    }
  });

  // Ask before reload/close while a round is running or scores exist. Browsers show their own
  // generic wording, and only after the page has been clicked or typed in.
  window.addEventListener("beforeunload", e => {
    if (game || leaderboard.length) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  renderBoard();
  nameInput.focus();
})();
</script>
</body>
</html>
